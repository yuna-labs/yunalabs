<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | Yuna Labs</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* Minimal safe defaults in case style.css is different */
    :root { --ok: #1b873f; --err: #b00020; }
    .container { max-width: 840px; margin: 0 auto; padding: 24px; }
    .contact-card { background:#fff; border:1px solid #eee; border-radius:12px; padding:24px; box-shadow:0 4px 20px rgba(0,0,0,.05); }
    form .row { display:flex; gap:16px; flex-wrap:wrap; }
    form .row > div { flex:1 1 260px; }
    label { display:block; font-weight:600; margin-bottom:6px; }
    input, textarea { width:100%; padding:12px; border:1px solid #ccc; border-radius:8px; font:inherit; }
    textarea { min-height:160px; resize:vertical; }
    button[type="submit"] { padding:12px 18px; border:0; border-radius:8px; font-weight:700; cursor:pointer; }
    .btn-primary { background:#111; color:#fff; }
    .status { margin-top:12px; font-size:.95rem; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .visually-hidden { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
    header, nav, footer { padding: 12px 0; }
    nav a { margin-right:16px; text-decoration:none; }
  </style>
</head>
<body>
  <header class="container">
    <nav>
      <a href="/index.html">Home</a>
      <a href="/about.html">About</a>
      <a href="/services.html">Services</a>
      <strong>Contact</strong>
    </nav>
  </header>

  <main class="container">
    <h1>Get in touch</h1>
    <div class="contact-card">
      <form id="contact-form" novalidate>
        <div class="row">
          <div>
            <label for="name">Your name</label>
            <input id="name" name="name" type="text" placeholder="Jane Doe" required />
          </div>
          <div>
            <label for="email">Your email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>
        </div>

        <div class="row">
          <div style="flex:1 1 100%">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="How can we help?" required></textarea>
          </div>
        </div>

        <!-- Honeypot (should remain empty) -->
        <input class="visually-hidden" type="text" name="hp" tabindex="-1" autocomplete="off" />

        <button class="btn-primary" id="submitBtn" type="submit">Send</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <footer class="container">
    <small>&copy; <span id="yr"></span> Yuna Labs</small>
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    const form = document.getElementById('contact-form');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    function setStatus(text, cls) {
      statusEl.textContent = text || '';
      statusEl.className = 'status ' + (cls || '');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      setStatus('Sending…');
      submitBtn.disabled = true;

      const payload = Object.fromEntries(new FormData(form).entries());

      try {
        const res = await fetch('/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok || !data.ok) {
          throw new Error(data.error || 'Failed to send');
        }

        setStatus('Thanks! Your message was sent.', 'ok');
        form.reset();
      } catch (err) {
        console.error(err);
        setStatus('Sorry, something went wrong. Please try again.', 'err');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
