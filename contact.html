<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">Yuna Labs</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active btn">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="page-header">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you. Let’s discuss how we can work together.</p>
  </section>

  <section class="content contact-form">
    <form>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit" class="btn-primary">Send Message</button>
    </form>
    <p>Email us directly: <a href="mailto:info@yuna-labs.com">info@yuna-labs.com</a></p>
  </section>

  <footer>
    <p>&copy; 2025 Yuna Labs. All rights reserved.</p>
  </footer>

</html>
