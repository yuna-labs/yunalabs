<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Analytics engineering">
  <defs>
    <linearGradient id="ia-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5fafa"/>
      <stop offset="100%" stop-color="#e6f4f4"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#ia-bg)" stroke="#c4e4e4" stroke-width="1"/>

  <!-- Edges -->
  <g stroke="#007F80" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.65">
    <path d="M 16 20 C 22 20, 24 26, 28 26"/>
    <path d="M 16 44 C 22 44, 24 38, 28 38"/>
    <path d="M 36 26 L 44 22"/>
    <path d="M 36 38 L 44 42"/>
  </g>

  <!-- Source nodes (left) — circle dots -->
  <g>
    <circle cx="14" cy="20" r="3.6" fill="#ffffff" stroke="#8ebcbc" stroke-width="1.2"/>
    <circle cx="14" cy="20" r="1.6" fill="#007F80"/>
    <circle cx="14" cy="44" r="3.6" fill="#ffffff" stroke="#8ebcbc" stroke-width="1.2"/>
    <circle cx="14" cy="44" r="1.6" fill="#4eabab"/>
  </g>

  <!-- Model nodes (middle) — rounded squares -->
  <g>
    <rect x="26" y="22" width="12" height="9" rx="2" fill="#ffffff" stroke="#8ebcbc" stroke-width="1.2"/>
    <line x1="29" y1="26" x2="35" y2="26" stroke="#4eabab" stroke-width="1"/>
    <line x1="29" y1="28.5" x2="33" y2="28.5" stroke="#4eabab" stroke-width="1" opacity="0.6"/>

    <rect x="26" y="34" width="12" height="9" rx="2" fill="#ffffff" stroke="#8ebcbc" stroke-width="1.2"/>
    <line x1="29" y1="38" x2="35" y2="38" stroke="#4eabab" stroke-width="1"/>
    <line x1="29" y1="40.5" x2="33" y2="40.5" stroke="#4eabab" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Mart node (right, larger, dark) -->
  <rect x="42" y="18" width="14" height="28" rx="3" fill="#004242"/>
  <line x1="45" y1="23" x2="53" y2="23" stroke="#4eabab" stroke-width="1.2"/>
  <line x1="45" y1="27" x2="51" y2="27" stroke="#4eabab" stroke-width="1" opacity="0.7"/>
  <line x1="45" y1="31" x2="52" y2="31" stroke="#4eabab" stroke-width="1" opacity="0.55"/>
  <line x1="45" y1="35" x2="50" y2="35" stroke="#4eabab" stroke-width="1" opacity="0.4"/>

  <!-- Test passing badge -->
  <circle cx="54" cy="46" r="6" fill="#ffffff" stroke="#1b873f" stroke-width="1.4"/>
  <polyline points="51,46 53,48 57,44" fill="none" stroke="#1b873f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
