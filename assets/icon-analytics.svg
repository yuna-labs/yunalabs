<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Analytics engineering">
  <rect x="1" y="1" width="62" height="62" rx="12" fill="#e6f4f4" stroke="#c4e4e4" stroke-width="1"/>
  <!-- DAG nodes -->
  <g fill="#004242">
    <circle cx="16" cy="22" r="3.5"/>
    <circle cx="16" cy="42" r="3.5"/>
    <circle cx="32" cy="32" r="4"/>
    <circle cx="48" cy="22" r="3.5"/>
    <circle cx="48" cy="42" r="3.5"/>
  </g>
  <!-- Edges -->
  <g stroke="#007F80" stroke-width="1.6" fill="none" stroke-linecap="round">
    <line x1="19" y1="23" x2="29" y2="31"/>
    <line x1="19" y1="41" x2="29" y2="33"/>
    <line x1="35" y1="31" x2="45" y2="23"/>
    <line x1="35" y1="33" x2="45" y2="41"/>
  </g>
  <!-- Checkmark accent on center node -->
  <g stroke="#4eabab" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="29.5,32 31.5,34 34.5,30"/>
  </g>
</svg>
