<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cloud platform and DevOps">
  <rect x="1" y="1" width="62" height="62" rx="12" fill="#e6f4f4" stroke="#c4e4e4" stroke-width="1"/>
  <!-- Three stacked platform layers -->
  <g>
    <rect x="14" y="16" width="36" height="8" rx="2" fill="#004242"/>
    <rect x="14" y="28" width="36" height="8" rx="2" fill="#007F80"/>
    <rect x="14" y="40" width="36" height="8" rx="2" fill="#4eabab"/>
  </g>
  <!-- Connector dots on each layer -->
  <g fill="#edf5f5">
    <circle cx="20" cy="20" r="1.4"/>
    <circle cx="26" cy="20" r="1.4"/>
    <circle cx="20" cy="32" r="1.4"/>
    <circle cx="26" cy="32" r="1.4"/>
    <circle cx="20" cy="44" r="1.4"/>
    <circle cx="26" cy="44" r="1.4"/>
  </g>
  <!-- Right-side vertical connector -->
  <g stroke="#004242" stroke-width="1.4" fill="none">
    <line x1="54" y1="20" x2="54" y2="44"/>
    <circle cx="54" cy="20" r="2" fill="#004242"/>
    <circle cx="54" cy="32" r="2" fill="#004242"/>
    <circle cx="54" cy="44" r="2" fill="#004242"/>
  </g>
</svg>
