<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-label="End-to-end data pipeline: Postgres, Stripe, and Salesforce sources flowing through Fivetran ingestion, Snowflake storage, and dbt transformation into Looker dashboards and Slack alerts">
  <defs>
    <linearGradient id="hp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5fafa"/>
    </linearGradient>
    <linearGradient id="hp-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ebcbc"/>
      <stop offset="100%" stop-color="#007F80"/>
    </linearGradient>
    <linearGradient id="hp-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#012a2a"/>
      <stop offset="100%" stop-color="#011212"/>
    </linearGradient>
    <linearGradient id="hp-progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4eabab"/>
      <stop offset="100%" stop-color="#007F80"/>
    </linearGradient>
    <pattern id="hp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e6f4f4" stroke-width="1"/>
    </pattern>
    <marker id="hp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#007F80"/>
    </marker>
    <filter id="hp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#011212" flood-opacity="0.08"/>
    </filter>
    <style><![CDATA[
      .hp-flow path {
        stroke-dasharray: 28 6;
        animation: hp-flow 1.6s linear infinite;
      }
      @keyframes hp-flow { to { stroke-dashoffset: -34; } }

      .hp-pulse {
        transform-origin: center;
        transform-box: fill-box;
        animation: hp-pulse 1.8s ease-in-out infinite;
      }
      @keyframes hp-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.35; transform: scale(0.78); }
      }

      .hp-shimmer {
        animation: hp-shimmer 2.2s ease-in-out infinite;
        transform-origin: left center;
        transform-box: fill-box;
      }
      @keyframes hp-shimmer {
        0%, 100% { opacity: 0.85; }
        50%      { opacity: 1;    }
      }

      .hp-blink {
        animation: hp-blink 2s ease-in-out infinite;
      }
      @keyframes hp-blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.45; }
      }

      @media (prefers-reduced-motion: reduce) {
        .hp-flow path, .hp-pulse, .hp-shimmer, .hp-blink {
          animation: none;
        }
      }
    ]]></style>
  </defs>

  <!-- ====== Frame ====== -->
  <rect x="0" y="0" width="800" height="460" rx="18" fill="url(#hp-bg)" stroke="#c4e4e4" stroke-width="1"/>
  <rect x="0" y="0" width="800" height="42" rx="18" fill="url(#hp-chrome)"/>
  <rect x="0" y="28" width="800" height="14" fill="#011212"/>
  <circle cx="22" cy="21" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="21" r="5.5" fill="#ffbd2e"/>
  <circle cx="62" cy="21" r="5.5" fill="#27c93f"/>
  <rect x="280" y="11" width="240" height="22" rx="11" fill="#012a2a" stroke="#0a3838"/>
  <text x="400" y="26" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#8ebaba" text-anchor="middle" letter-spacing="0.3">orchestrator · run #4821 · production</text>
  <circle cx="744" cy="22" r="3.5" fill="#4eabab" class="hp-pulse"/>
  <text x="752" y="26" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#4eabab">live</text>

  <!-- Subtle grid in working area -->
  <rect x="0" y="42" width="800" height="418" fill="url(#hp-grid)" opacity="0.6"/>

  <!-- ====== Lane labels ====== -->
  <g font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" fill="#3d5a5a" letter-spacing="2" font-weight="600">
    <text x="92"  y="76" text-anchor="middle">SOURCES</text>
    <text x="266" y="76" text-anchor="middle">INGEST</text>
    <text x="420" y="76" text-anchor="middle">STORE</text>
    <text x="574" y="76" text-anchor="middle">TRANSFORM</text>
    <text x="722" y="76" text-anchor="middle">SERVE</text>
  </g>

  <!-- ====== Connector lines (drawn behind cards) ====== -->
  <g class="hp-flow" fill="none" stroke="url(#hp-edge)" stroke-width="1.8" opacity="0.9">
    <!-- sources -> Fivetran -->
    <path d="M 156 132 C 190 132, 196 200, 216 200" marker-end="url(#hp-arrow)"/>
    <path d="M 156 208 L 216 208" marker-end="url(#hp-arrow)"/>
    <path d="M 156 284 C 190 284, 196 216, 216 216" marker-end="url(#hp-arrow)"/>
    <!-- Fivetran -> Snowflake -->
    <path d="M 350 208 L 380 208" marker-end="url(#hp-arrow)"/>
    <!-- Snowflake -> dbt -->
    <path d="M 504 208 L 534 208" marker-end="url(#hp-arrow)"/>
    <!-- dbt -> Serve -->
    <path d="M 668 200 C 692 200, 696 158, 720 158" marker-end="url(#hp-arrow)"/>
    <path d="M 668 216 C 692 216, 696 258, 720 258" marker-end="url(#hp-arrow)"/>
  </g>

  <!-- ====== Source cards ====== -->
  <g font-family="'Inter', system-ui, sans-serif">
    <!-- Postgres -->
    <g filter="url(#hp-shadow)">
      <rect x="28" y="98" width="128" height="68" rx="10" fill="#ffffff" stroke="#c4e4e4"/>
    </g>
    <ellipse cx="50" cy="124" rx="9" ry="4" fill="#004242"/>
    <rect x="41" y="124" width="18" height="14" fill="#004242"/>
    <ellipse cx="50" cy="138" rx="9" ry="4" fill="#004242"/>
    <text x="68" y="124" font-size="12" font-weight="600" fill="#011212">postgres</text>
    <text x="68" y="140" font-size="10" fill="#6a8080">prod · 24 tables</text>
    <text x="68" y="156" font-size="9" fill="#1b873f" font-weight="600">● 4m ago</text>

    <!-- Stripe -->
    <g filter="url(#hp-shadow)">
      <rect x="28" y="174" width="128" height="68" rx="10" fill="#ffffff" stroke="#c4e4e4"/>
    </g>
    <rect x="41" y="194" width="18" height="18" rx="4" fill="#635bff"/>
    <text x="50" y="207" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
    <text x="68" y="200" font-size="12" font-weight="600" fill="#011212">stripe</text>
    <text x="68" y="216" font-size="10" fill="#6a8080">webhooks · live</text>
    <text x="68" y="232" font-size="9" fill="#1b873f" font-weight="600">● streaming</text>

    <!-- Salesforce -->
    <g filter="url(#hp-shadow)">
      <rect x="28" y="250" width="128" height="68" rx="10" fill="#ffffff" stroke="#c4e4e4"/>
    </g>
    <circle cx="50" cy="278" r="10" fill="#00a1e0"/>
    <path d="M 44 276 q 6 -6 12 0 q 0 6 -6 6 q -6 0 -6 -6" fill="#ffffff" opacity="0.95"/>
    <text x="68" y="276" font-size="12" font-weight="600" fill="#011212">salesforce</text>
    <text x="68" y="292" font-size="10" fill="#6a8080">CRM · hourly</text>
    <text x="68" y="308" font-size="9" fill="#1b873f" font-weight="600">● 17m ago</text>
  </g>

  <!-- ====== Fivetran (Ingest) ====== -->
  <g filter="url(#hp-shadow)">
    <rect x="216" y="138" width="134" height="140" rx="10" fill="#ffffff" stroke="#c4e4e4"/>
  </g>
  <rect x="216" y="138" width="134" height="32" rx="10" fill="#f5fafa"/>
  <rect x="216" y="160" width="134" height="10" fill="#f5fafa"/>
  <circle cx="232" cy="154" r="5" fill="#007F80"/>
  <text x="244" y="158" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#011212" font-weight="700">Fivetran</text>
  <text x="244" y="226" font-family="'Inter', sans-serif" font-size="9.5" fill="#6a8080">syncing</text>
  <text x="284" y="226" font-family="'Inter', sans-serif" font-size="9.5" fill="#011212" font-weight="600">8 / 8 tables</text>
  <rect x="232" y="232" width="102" height="6" rx="3" fill="#e6f4f4"/>
  <rect x="232" y="232" width="92"  height="6" rx="3" fill="url(#hp-progress)" class="hp-shimmer"/>
  <g font-family="'Inter', sans-serif" font-size="9" fill="#3d5a5a">
    <text x="232" y="194">users</text>
    <text x="330" y="194" text-anchor="end" fill="#1b873f">✓</text>
    <text x="232" y="208">orders</text>
    <text x="330" y="208" text-anchor="end" fill="#1b873f">✓</text>
  </g>
  <text x="232" y="258" font-family="'Inter', sans-serif" font-size="9" fill="#6a8080">incremental · CDC</text>
  <text x="232" y="270" font-family="'Inter', sans-serif" font-size="9" fill="#1b873f" font-weight="600">last run · 4m</text>

  <!-- ====== Snowflake (Store) ====== -->
  <g filter="url(#hp-shadow)">
    <rect x="380" y="138" width="124" height="140" rx="10" fill="#ffffff" stroke="#c4e4e4"/>
  </g>
  <rect x="380" y="138" width="124" height="32" rx="10" fill="#f5fafa"/>
  <rect x="380" y="160" width="124" height="10" fill="#f5fafa"/>
  <g transform="translate(394,148)">
    <circle cx="6" cy="6" r="6" fill="#29b5e8"/>
    <line x1="6" y1="0"  x2="6" y2="12" stroke="#ffffff" stroke-width="1.4"/>
    <line x1="0" y1="6"  x2="12" y2="6" stroke="#ffffff" stroke-width="1.4"/>
    <line x1="1.8" y1="1.8" x2="10.2" y2="10.2" stroke="#ffffff" stroke-width="1.4"/>
    <line x1="10.2" y1="1.8" x2="1.8" y2="10.2" stroke="#ffffff" stroke-width="1.4"/>
  </g>
  <text x="414" y="158" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#011212" font-weight="700">Snowflake</text>

  <text x="394" y="190" font-family="'Inter', sans-serif" font-size="9.5" fill="#6a8080" letter-spacing="0.5">WAREHOUSE</text>
  <text x="394" y="206" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#011212" font-weight="700">ANALYTICS_WH</text>

  <g font-family="'Inter', sans-serif" font-size="9" fill="#3d5a5a">
    <rect x="394" y="218" width="46" height="18" rx="4" fill="#e6f4f4"/>
    <text x="417" y="231" text-anchor="middle" fill="#004242" font-weight="600">M-size</text>
    <rect x="446" y="218" width="46" height="18" rx="4" fill="#e6f4f4"/>
    <text x="469" y="231" text-anchor="middle" fill="#004242" font-weight="600">auto-suspend</text>
  </g>
  <text x="394" y="258" font-family="'Inter', sans-serif" font-size="9" fill="#6a8080">credits today</text>
  <text x="500" y="258" font-family="'Inter', sans-serif" font-size="9" fill="#011212" font-weight="600" text-anchor="end">2.1 cr</text>
  <text x="394" y="270" font-family="'Inter', sans-serif" font-size="9" fill="#6a8080">est. spend</text>
  <text x="500" y="270" font-family="'Inter', sans-serif" font-size="9" fill="#011212" font-weight="600" text-anchor="end">$12.40/day</text>

  <!-- ====== dbt (Transform) ====== -->
  <g filter="url(#hp-shadow)">
    <rect x="534" y="138" width="134" height="140" rx="10" fill="#ffffff" stroke="#c4e4e4"/>
  </g>
  <rect x="534" y="138" width="134" height="32" rx="10" fill="#f5fafa"/>
  <rect x="534" y="160" width="134" height="10" fill="#f5fafa"/>
  <rect x="548" y="148" width="12" height="12" rx="2" fill="#ff694a"/>
  <text x="554" y="157" font-family="'Inter', sans-serif" font-size="9" fill="#ffffff" font-weight="700" text-anchor="middle">d</text>
  <text x="566" y="158" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#011212" font-weight="700">dbt</text>

  <g font-family="'Inter', sans-serif" font-size="9" fill="#3d5a5a">
    <text x="548" y="190">staging</text>
    <text x="654" y="190" text-anchor="end" fill="#011212" font-weight="600">12</text>
    <text x="548" y="206">intermediate</text>
    <text x="654" y="206" text-anchor="end" fill="#011212" font-weight="600">9</text>
    <text x="548" y="222">marts</text>
    <text x="654" y="222" text-anchor="end" fill="#011212" font-weight="600">17</text>
  </g>
  <line x1="548" y1="234" x2="654" y2="234" stroke="#e6f4f4"/>
  <text x="548" y="252" font-family="'Inter', sans-serif" font-size="9" fill="#6a8080">tests</text>
  <text x="654" y="252" font-family="'Inter', sans-serif" font-size="10" fill="#1b873f" text-anchor="end" font-weight="700">248 / 250 ✓</text>
  <text x="548" y="268" font-family="'Inter', sans-serif" font-size="9" fill="#6a8080">freshness</text>
  <text x="654" y="268" font-family="'Inter', sans-serif" font-size="10" fill="#1b873f" text-anchor="end" font-weight="700">on track</text>

  <!-- ====== Serve column ====== -->
  <!-- Looker tile -->
  <g filter="url(#hp-shadow)">
    <rect x="720" y="124" width="68" height="68" rx="10" fill="#ffffff" stroke="#c4e4e4"/>
  </g>
  <g transform="translate(728,134)">
    <rect x="0" y="0" width="52" height="36" rx="4" fill="#011212"/>
    <rect x="6"  y="22" width="6" height="10" fill="#4eabab"/>
    <rect x="16" y="16" width="6" height="16" fill="#007F80"/>
    <rect x="26" y="10" width="6" height="22" fill="#007F80"/>
    <rect x="36" y="18" width="6" height="14" fill="#4eabab"/>
  </g>
  <text x="754" y="184" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#011212" text-anchor="middle">Looker</text>

  <!-- Slack alert tile -->
  <g filter="url(#hp-shadow)">
    <rect x="720" y="224" width="68" height="68" rx="10" fill="#ffffff" stroke="#c4e4e4"/>
  </g>
  <g transform="translate(734,234)">
    <rect x="0"  y="6"  width="14" height="6" rx="2" fill="#e01e5a"/>
    <rect x="14" y="0"  width="6"  height="14" rx="2" fill="#36c5f0"/>
    <rect x="6"  y="14" width="14" height="6" rx="2" fill="#2eb67d"/>
    <rect x="0"  y="14" width="6"  height="6" rx="2" fill="#ecb22e"/>
  </g>
  <text x="754" y="280" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#011212" text-anchor="middle">Slack #alerts</text>

  <!-- ====== Bottom status bar ====== -->
  <rect x="20" y="324" width="760" height="120" rx="12" fill="#011212"/>
  <g font-family="'Inter', system-ui, sans-serif">
    <!-- Title -->
    <text x="36" y="352" font-size="11" fill="#8ebaba" letter-spacing="2">PLATFORM HEALTH · LAST 24H</text>

    <!-- Stat 1 -->
    <text x="36" y="384" font-size="10" fill="#6a8080">run success</text>
    <text x="36" y="408" font-family="'Space Grotesk', sans-serif" font-size="22" fill="#ffffff" font-weight="700">99.8<tspan font-size="13" fill="#8ebaba">%</tspan></text>
    <text x="36" y="430" font-size="9.5" fill="#4eabab">▲ 0.3 pts vs 7d</text>

    <line x1="200" y1="368" x2="200" y2="430" stroke="#0a3838"/>

    <!-- Stat 2 -->
    <text x="220" y="384" font-size="10" fill="#6a8080">tests passing</text>
    <text x="220" y="408" font-family="'Space Grotesk', sans-serif" font-size="22" fill="#ffffff" font-weight="700">248 <tspan font-size="13" fill="#8ebaba">/ 250</tspan></text>
    <text x="220" y="430" font-size="9.5" fill="#4eabab">2 flaky · isolated</text>

    <line x1="384" y1="368" x2="384" y2="430" stroke="#0a3838"/>

    <!-- Stat 3 -->
    <text x="404" y="384" font-size="10" fill="#6a8080">p95 model build</text>
    <text x="404" y="408" font-family="'Space Grotesk', sans-serif" font-size="22" fill="#ffffff" font-weight="700">3.4<tspan font-size="13" fill="#8ebaba">s</tspan></text>
    <text x="404" y="430" font-size="9.5" fill="#4eabab">▼ 12% vs 7d</text>

    <line x1="568" y1="368" x2="568" y2="430" stroke="#0a3838"/>

    <!-- Stat 4 -->
    <text x="588" y="384" font-size="10" fill="#6a8080">cost · today</text>
    <text x="588" y="408" font-family="'Space Grotesk', sans-serif" font-size="22" fill="#ffffff" font-weight="700">$12.40</text>
    <text x="588" y="430" font-size="9.5" fill="#4eabab">on budget</text>

    <!-- Sparkline -->
    <polyline points="640,420 654,414 666,418 680,408 692,412 706,402 720,406 734,392 748,396 762,386"
              fill="none" stroke="#4eabab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="762" cy="386" r="2.5" fill="#4eabab" class="hp-pulse"/>
  </g>

</svg>
