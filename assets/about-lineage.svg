<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-label="Data lineage DAG: raw sources feeding staging models, then marts, exposed as dashboards and metrics with test counts and freshness indicators">
  <defs>
    <linearGradient id="al-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5fafa"/>
    </linearGradient>
    <linearGradient id="al-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#012a2a"/>
      <stop offset="100%" stop-color="#011212"/>
    </linearGradient>
    <linearGradient id="al-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ebcbc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#007F80" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="al-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e6f4f4" stroke-width="1"/>
    </pattern>
    <filter id="al-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#011212" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="0" y="0" width="800" height="460" rx="18" fill="url(#al-bg)" stroke="#c4e4e4"/>

  <!-- Chrome -->
  <rect x="0" y="0" width="800" height="42" rx="18" fill="url(#al-chrome)"/>
  <rect x="0" y="28" width="800" height="14" fill="#011212"/>
  <circle cx="22" cy="21" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="21" r="5.5" fill="#ffbd2e"/>
  <circle cx="62" cy="21" r="5.5" fill="#27c93f"/>
  <rect x="280" y="11" width="240" height="22" rx="11" fill="#012a2a" stroke="#0a3838"/>
  <text x="400" y="26" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#8ebaba" text-anchor="middle" letter-spacing="0.3">dbt docs · lineage · production</text>

  <!-- Grid -->
  <rect x="0" y="42" width="800" height="418" fill="url(#al-grid)" opacity="0.6"/>

  <!-- Column lane labels -->
  <g font-family="'Space Grotesk', sans-serif" font-size="10" letter-spacing="2" font-weight="700">
    <text x="100" y="74" fill="#3d5a5a" text-anchor="middle">RAW</text>
    <text x="300" y="74" fill="#3d5a5a" text-anchor="middle">STAGING</text>
    <text x="500" y="74" fill="#3d5a5a" text-anchor="middle">MARTS</text>
    <text x="700" y="74" fill="#3d5a5a" text-anchor="middle">EXPOSED</text>
  </g>
  <g font-family="'Inter', sans-serif" font-size="10" fill="#6a8080">
    <text x="100" y="88" text-anchor="middle">replicated, untyped</text>
    <text x="300" y="88" text-anchor="middle">typed, cleaned</text>
    <text x="500" y="88" text-anchor="middle">business logic</text>
    <text x="700" y="88" text-anchor="middle">dashboards · APIs</text>
  </g>

  <!-- Vertical column dividers -->
  <g stroke="#e6f4f4" stroke-width="1" stroke-dasharray="2 4">
    <line x1="200" y1="100" x2="200" y2="400"/>
    <line x1="400" y1="100" x2="400" y2="400"/>
    <line x1="600" y1="100" x2="600" y2="400"/>
  </g>

  <!-- ===== Edges (drawn before nodes) ===== -->
  <g fill="none" stroke="url(#al-edge)" stroke-width="1.6">
    <!-- raw -> staging -->
    <path d="M 158 134 C 200 134, 220 144, 244 144"/>
    <path d="M 158 210 L 244 210"/>
    <path d="M 158 286 C 200 286, 220 276, 244 276"/>
    <!-- staging -> marts -->
    <path d="M 358 144 C 400 144, 420 170, 444 170"/>
    <path d="M 358 210 C 400 210, 420 200, 444 200"/>
    <path d="M 358 276 C 400 276, 420 240, 444 240"/>
    <path d="M 358 210 C 400 210, 420 300, 444 300"/>
    <!-- marts -> exposed -->
    <path d="M 556 170 C 600 170, 620 142, 644 142"/>
    <path d="M 556 240 C 600 240, 620 220, 644 220"/>
    <path d="M 556 240 C 600 240, 620 290, 644 290"/>
    <path d="M 556 300 C 600 300, 620 360, 644 360"/>
  </g>

  <!-- ===== RAW (col 1) ===== -->
  <g font-family="'Inter', system-ui, sans-serif">
    <!-- orders -->
    <g filter="url(#al-shadow)">
      <rect x="42" y="110" width="116" height="50" rx="8" fill="#ffffff" stroke="#c4e4e4"/>
    </g>
    <circle cx="58" cy="128" r="4" fill="#1b873f"/>
    <text x="68" y="132" font-size="11" font-weight="700" fill="#011212">orders</text>
    <text x="58" y="148" font-size="9" fill="#6a8080">postgres · 4m ago</text>

    <!-- users -->
    <g filter="url(#al-shadow)">
      <rect x="42" y="186" width="116" height="50" rx="8" fill="#ffffff" stroke="#c4e4e4"/>
    </g>
    <circle cx="58" cy="204" r="4" fill="#1b873f"/>
    <text x="68" y="208" font-size="11" font-weight="700" fill="#011212">users</text>
    <text x="58" y="224" font-size="9" fill="#6a8080">postgres · 4m ago</text>

    <!-- events -->
    <g filter="url(#al-shadow)">
      <rect x="42" y="262" width="116" height="50" rx="8" fill="#ffffff" stroke="#c4e4e4"/>
    </g>
    <circle cx="58" cy="280" r="4" fill="#1b873f"/>
    <text x="68" y="284" font-size="11" font-weight="700" fill="#011212">events</text>
    <text x="58" y="300" font-size="9" fill="#6a8080">kafka · streaming</text>
  </g>

  <!-- ===== STAGING (col 2) ===== -->
  <g font-family="'Inter', system-ui, sans-serif">
    <!-- stg_orders -->
    <g filter="url(#al-shadow)">
      <rect x="244" y="120" width="114" height="48" rx="8" fill="#ffffff" stroke="#c4e4e4"/>
    </g>
    <rect x="244" y="120" width="4" height="48" rx="2" fill="#4eabab"/>
    <text x="256" y="138" font-size="10.5" font-weight="700" fill="#011212">stg_orders</text>
    <g font-size="8.5">
      <rect x="256" y="146" width="34" height="14" rx="3" fill="#e6f4f4"/>
      <text x="273" y="156" fill="#004242" text-anchor="middle" font-weight="600">12 ✓</text>
      <text x="294" y="156" fill="#6a8080">tests</text>
    </g>

    <!-- stg_users -->
    <g filter="url(#al-shadow)">
      <rect x="244" y="186" width="114" height="48" rx="8" fill="#ffffff" stroke="#c4e4e4"/>
    </g>
    <rect x="244" y="186" width="4" height="48" rx="2" fill="#4eabab"/>
    <text x="256" y="204" font-size="10.5" font-weight="700" fill="#011212">stg_users</text>
    <g font-size="8.5">
      <rect x="256" y="212" width="34" height="14" rx="3" fill="#e6f4f4"/>
      <text x="273" y="222" fill="#004242" text-anchor="middle" font-weight="600">8 ✓</text>
      <text x="294" y="222" fill="#6a8080">tests</text>
    </g>

    <!-- stg_events -->
    <g filter="url(#al-shadow)">
      <rect x="244" y="252" width="114" height="48" rx="8" fill="#ffffff" stroke="#c4e4e4"/>
    </g>
    <rect x="244" y="252" width="4" height="48" rx="2" fill="#4eabab"/>
    <text x="256" y="270" font-size="10.5" font-weight="700" fill="#011212">stg_events</text>
    <g font-size="8.5">
      <rect x="256" y="278" width="34" height="14" rx="3" fill="#fff4e6"/>
      <text x="273" y="288" fill="#a85a00" text-anchor="middle" font-weight="600">14 ✓</text>
      <text x="294" y="288" fill="#6a8080">tests · 1 warn</text>
    </g>
  </g>

  <!-- ===== MARTS (col 3) ===== -->
  <g font-family="'Inter', system-ui, sans-serif">
    <!-- fct_orders -->
    <g filter="url(#al-shadow)">
      <rect x="444" y="146" width="112" height="48" rx="8" fill="#004242"/>
    </g>
    <text x="500" y="166" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">fct_orders</text>
    <g font-size="8.5">
      <rect x="456" y="172" width="34" height="14" rx="3" fill="#012a2a"/>
      <text x="473" y="182" fill="#4eabab" text-anchor="middle" font-weight="600">22 ✓</text>
      <text x="494" y="182" fill="#8ebaba">contract</text>
    </g>

    <!-- dim_users -->
    <g filter="url(#al-shadow)">
      <rect x="444" y="216" width="112" height="48" rx="8" fill="#004242"/>
    </g>
    <text x="500" y="236" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">dim_users</text>
    <g font-size="8.5">
      <rect x="456" y="242" width="34" height="14" rx="3" fill="#012a2a"/>
      <text x="473" y="252" fill="#4eabab" text-anchor="middle" font-weight="600">16 ✓</text>
      <text x="494" y="252" fill="#8ebaba">contract</text>
    </g>

    <!-- mart_session -->
    <g filter="url(#al-shadow)">
      <rect x="444" y="282" width="112" height="48" rx="8" fill="#004242"/>
    </g>
    <text x="500" y="302" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">mart_sessions</text>
    <g font-size="8.5">
      <rect x="456" y="308" width="34" height="14" rx="3" fill="#012a2a"/>
      <text x="473" y="318" fill="#4eabab" text-anchor="middle" font-weight="600">11 ✓</text>
      <text x="494" y="318" fill="#8ebaba">contract</text>
    </g>
  </g>

  <!-- ===== EXPOSED (col 4) ===== -->
  <g font-family="'Inter', system-ui, sans-serif">
    <!-- Revenue -->
    <g filter="url(#al-shadow)">
      <rect x="644" y="118" width="116" height="48" rx="8" fill="#ffffff" stroke="#c4e4e4"/>
    </g>
    <rect x="652" y="128" width="20" height="28" rx="3" fill="#011212"/>
    <rect x="655" y="146" width="3" height="6" fill="#4eabab"/>
    <rect x="660" y="140" width="3" height="12" fill="#007F80"/>
    <rect x="665" y="136" width="3" height="16" fill="#007F80"/>
    <text x="678" y="138" font-size="11" font-weight="700" fill="#011212">Revenue</text>
    <text x="678" y="156" font-size="9" fill="#6a8080">Looker · owner: rev-ops</text>

    <!-- Retention -->
    <g filter="url(#al-shadow)">
      <rect x="644" y="196" width="116" height="48" rx="8" fill="#ffffff" stroke="#c4e4e4"/>
    </g>
    <polyline points="652,224 660,218 668,220 674,214 680,212" fill="none" stroke="#007F80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="688" y="216" font-size="11" font-weight="700" fill="#011212">Retention</text>
    <text x="688" y="234" font-size="9" fill="#6a8080">Tableau · cohort</text>

    <!-- API -->
    <g filter="url(#al-shadow)">
      <rect x="644" y="266" width="116" height="48" rx="8" fill="#ffffff" stroke="#c4e4e4"/>
    </g>
    <g transform="translate(654,280)" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="11" fill="#7a77ff">
      <text x="0" y="0">{ }</text>
    </g>
    <text x="678" y="286" font-size="11" font-weight="700" fill="#011212">Metrics API</text>
    <text x="678" y="304" font-size="9" fill="#6a8080">cube · embedded</text>

    <!-- Forecast model -->
    <g filter="url(#al-shadow)">
      <rect x="644" y="336" width="116" height="48" rx="8" fill="#ffffff" stroke="#c4e4e4"/>
    </g>
    <circle cx="656" cy="360" r="3" fill="#4eabab"/>
    <circle cx="664" cy="354" r="3" fill="#007F80"/>
    <circle cx="672" cy="358" r="3" fill="#007F80"/>
    <text x="684" y="356" font-size="11" font-weight="700" fill="#011212">Forecast ML</text>
    <text x="684" y="374" font-size="9" fill="#6a8080">notebook · weekly</text>
  </g>

  <!-- ===== Bottom status row ===== -->
  <rect x="20" y="412" width="760" height="36" rx="10" fill="#011212"/>
  <g font-family="'Inter', sans-serif" font-size="10" fill="#a8ccca">
    <text x="36" y="434" letter-spacing="1.4" fill="#8ebaba">END TO END</text>
    <circle cx="172" cy="430" r="3.5" fill="#1b873f"/>
    <text x="182" y="434"><tspan font-weight="700" fill="#ffffff">38</tspan> models</text>
    <circle cx="280" cy="430" r="3.5" fill="#1b873f"/>
    <text x="290" y="434"><tspan font-weight="700" fill="#ffffff">248 / 250</tspan> tests passing</text>
    <circle cx="450" cy="430" r="3.5" fill="#1b873f"/>
    <text x="460" y="434">freshness · <tspan font-weight="700" fill="#ffffff">on track</tspan></text>
    <circle cx="580" cy="430" r="3.5" fill="#1b873f"/>
    <text x="590" y="434">build · <tspan font-weight="700" fill="#ffffff">3.4s p95</tspan></text>
    <text x="764" y="434" text-anchor="end" fill="#4eabab" font-weight="700">● live</text>
  </g>
</svg>
