<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Data lineage and model graph">
  <defs>
    <linearGradient id="aboutBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf5f5"/>
      <stop offset="100%" stop-color="#e6f4f4"/>
    </linearGradient>
    <pattern id="aboutGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#c4e4e4" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="720" height="320" fill="url(#aboutBg)"/>
  <rect width="720" height="320" fill="url(#aboutGrid)"/>

  <!-- Column labels -->
  <g font-family="'Space Grotesk', sans-serif" font-size="10" fill="#3d5a5a" letter-spacing="1.4">
    <text x="90"  y="36" text-anchor="middle">RAW</text>
    <text x="260" y="36" text-anchor="middle">STAGING</text>
    <text x="430" y="36" text-anchor="middle">MARTS</text>
    <text x="620" y="36" text-anchor="middle">EXPOSED</text>
  </g>

  <!-- Edges (drawn first so nodes overlay) -->
  <g stroke="#007F80" stroke-width="1.2" fill="none" opacity="0.55">
    <path d="M 128 80  C 180 80, 200 100, 232 110"/>
    <path d="M 128 160 C 180 160, 200 170, 232 170"/>
    <path d="M 128 240 C 180 240, 200 220, 232 210"/>

    <path d="M 298 110 C 340 110, 360 130, 402 140"/>
    <path d="M 298 170 C 340 170, 360 170, 402 170"/>
    <path d="M 298 210 C 340 210, 360 200, 402 200"/>

    <path d="M 468 140 C 510 140, 540 110, 588 110"/>
    <path d="M 468 170 C 510 170, 540 170, 588 170"/>
    <path d="M 468 200 C 510 200, 540 230, 588 230"/>
  </g>

  <!-- Column 1: Raw sources -->
  <g>
    <rect x="60"  y="62"  width="70" height="36" rx="8" fill="#ffffff" stroke="#8ebcbc"/>
    <text x="95"  y="85"  font-family="'Space Grotesk', sans-serif" font-size="11" fill="#004242" text-anchor="middle" font-weight="600">orders</text>
    <rect x="60"  y="142" width="70" height="36" rx="8" fill="#ffffff" stroke="#8ebcbc"/>
    <text x="95"  y="165" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#004242" text-anchor="middle" font-weight="600">users</text>
    <rect x="60"  y="222" width="70" height="36" rx="8" fill="#ffffff" stroke="#8ebcbc"/>
    <text x="95"  y="245" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#004242" text-anchor="middle" font-weight="600">events</text>
  </g>

  <!-- Column 2: Staging -->
  <g>
    <rect x="232" y="92"  width="66" height="36" rx="8" fill="#c4e4e4" stroke="#4eabab"/>
    <text x="265" y="115" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#004242" text-anchor="middle" font-weight="600">stg_orders</text>
    <rect x="232" y="152" width="66" height="36" rx="8" fill="#c4e4e4" stroke="#4eabab"/>
    <text x="265" y="175" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#004242" text-anchor="middle" font-weight="600">stg_users</text>
    <rect x="232" y="192" width="66" height="36" rx="8" fill="#c4e4e4" stroke="#4eabab"/>
    <text x="265" y="215" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#004242" text-anchor="middle" font-weight="600">stg_events</text>
  </g>

  <!-- Column 3: Marts -->
  <g>
    <rect x="402" y="122" width="66" height="36" rx="8" fill="#007F80" stroke="#004242"/>
    <text x="435" y="145" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#e6f4f4" text-anchor="middle" font-weight="600">fct_orders</text>
    <rect x="402" y="182" width="66" height="36" rx="8" fill="#007F80" stroke="#004242"/>
    <text x="435" y="205" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#e6f4f4" text-anchor="middle" font-weight="600">dim_users</text>
  </g>

  <!-- Column 4: Exposures -->
  <g>
    <rect x="588" y="92"  width="72" height="36" rx="8" fill="#ffffff" stroke="#8ebcbc"/>
    <text x="624" y="115" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#004242" text-anchor="middle" font-weight="600">Revenue</text>
    <rect x="588" y="152" width="72" height="36" rx="8" fill="#ffffff" stroke="#8ebcbc"/>
    <text x="624" y="175" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#004242" text-anchor="middle" font-weight="600">Retention</text>
    <rect x="588" y="212" width="72" height="36" rx="8" fill="#ffffff" stroke="#8ebcbc"/>
    <text x="624" y="235" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#004242" text-anchor="middle" font-weight="600">Forecast</text>
  </g>

  <!-- Caption -->
  <g font-family="'Space Grotesk', sans-serif" font-size="10" fill="#6a8080" letter-spacing="1.2">
    <text x="360" y="298" text-anchor="middle">EVERY MODEL · VERSIONED · TESTED · OBSERVED</text>
  </g>

  <rect x="0.5" y="0.5" width="719" height="319" fill="none" stroke="#c4e4e4" stroke-width="1"/>
</svg>
