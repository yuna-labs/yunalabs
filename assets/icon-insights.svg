<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dashboards and insights">
  <rect x="1" y="1" width="62" height="62" rx="12" fill="#e6f4f4" stroke="#c4e4e4" stroke-width="1"/>
  <!-- Chart frame -->
  <rect x="12" y="14" width="40" height="36" rx="3" fill="#ffffff" stroke="#8ebcbc" stroke-width="1"/>
  <!-- Axis -->
  <g stroke="#8ebcbc" stroke-width="0.8">
    <line x1="16" y1="44" x2="48" y2="44"/>
    <line x1="16" y1="22" x2="16" y2="44"/>
  </g>
  <!-- Bars -->
  <g fill="#4eabab">
    <rect x="19" y="36" width="4" height="8"/>
    <rect x="26" y="30" width="4" height="14"/>
  </g>
  <g fill="#007F80">
    <rect x="33" y="26" width="4" height="18"/>
    <rect x="40" y="20" width="4" height="24"/>
  </g>
  <!-- Trend line -->
  <polyline points="19,34 28,28 37,22 46,16" fill="none" stroke="#004242" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="46" cy="16" r="2.2" fill="#004242"/>
</svg>
