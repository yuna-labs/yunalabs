<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dashboards and insights">
  <defs>
    <linearGradient id="ii-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5fafa"/>
      <stop offset="100%" stop-color="#e6f4f4"/>
    </linearGradient>
    <linearGradient id="ii-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#007F80" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#007F80" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#ii-bg)" stroke="#c4e4e4" stroke-width="1"/>

  <!-- Main chart card -->
  <rect x="8" y="10" width="36" height="32" rx="3" fill="#ffffff" stroke="#8ebcbc" stroke-width="1"/>
  <!-- Title bar -->
  <rect x="8" y="10" width="36" height="6" rx="3" fill="#011212"/>
  <circle cx="11" cy="13" r="1" fill="#ff5f56"/>
  <circle cx="14" cy="13" r="1" fill="#ffbd2e"/>
  <circle cx="17" cy="13" r="1" fill="#27c93f"/>

  <!-- Chart area fill -->
  <path d="M 11 38 L 14 34 L 18 35 L 22 30 L 26 31 L 30 26 L 34 27 L 38 22 L 41 24 L 41 40 L 11 40 Z" fill="url(#ii-area)"/>
  <!-- Trend line -->
  <polyline points="11,38 14,34 18,35 22,30 26,31 30,26 34,27 38,22 41,24"
            fill="none" stroke="#007F80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="41" cy="24" r="1.4" fill="#ffffff" stroke="#007F80" stroke-width="1.2"/>

  <!-- Bars below trend (mini) -->
  <g>
    <rect x="11" y="36" width="2" height="4" rx="0.5" fill="#4eabab"/>
    <rect x="15" y="34" width="2" height="6" rx="0.5" fill="#007F80"/>
    <rect x="19" y="32" width="2" height="8" rx="0.5" fill="#007F80"/>
  </g>

  <!-- KPI tile (right) -->
  <rect x="48" y="10" width="10" height="16" rx="2" fill="#004242"/>
  <text x="53" y="18" font-family="'Space Grotesk', sans-serif" font-size="5" fill="#4eabab" text-anchor="middle" letter-spacing="0.4">MRR</text>
  <text x="53" y="23" font-family="'Space Grotesk', sans-serif" font-size="4.5" fill="#ffffff" text-anchor="middle" font-weight="700">$284k</text>

  <!-- Secondary KPI tile -->
  <rect x="48" y="28" width="10" height="14" rx="2" fill="#ffffff" stroke="#8ebcbc" stroke-width="1"/>
  <text x="53" y="34" font-family="'Space Grotesk', sans-serif" font-size="4.5" fill="#1b873f" text-anchor="middle" font-weight="700">▲ 12%</text>
  <text x="53" y="39" font-family="'Inter', sans-serif" font-size="3.5" fill="#6a8080" text-anchor="middle">vs 30d</text>

  <!-- Bottom row: "table" of recent rows -->
  <g>
    <rect x="8" y="46" width="50" height="3" rx="1" fill="#e6f4f4"/>
    <rect x="8" y="46" width="32" height="3" rx="1" fill="#007F80"/>

    <rect x="8" y="51" width="50" height="3" rx="1" fill="#e6f4f4"/>
    <rect x="8" y="51" width="24" height="3" rx="1" fill="#4eabab"/>

    <rect x="8" y="56" width="50" height="3" rx="1" fill="#e6f4f4"/>
    <rect x="8" y="56" width="40" height="3" rx="1" fill="#006C70"/>
  </g>
</svg>
